name: Build telegram-bot-api
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build di Ubuntu 20.04
        run: |
          mkdir out
          docker run --rm -e DEBIAN_FRONTEND=noninteractive -v "$PWD/out:/out" ubuntu:20.04 bash -c "set -e; apt-get update && apt-get install -y make git zlib1g-dev libssl-dev gperf cmake g++ ca-certificates && git clone --recursive https://github.com/tdlib/telegram-bot-api.git && cd telegram-bot-api && mkdir build && cd build && cmake -DCMAKE_BUILD_TYPE=Release .. && cmake --build . --target install -j3 && strip /usr/local/bin/telegram-bot-api && cp /usr/local/bin/telegram-bot-api /out/"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-bot-api
          path: out/telegram-bot-api
